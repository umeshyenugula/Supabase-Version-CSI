
<div class="event-detail-page">
  <div class="event-hero-banner" id="eventHeroBanner">
    <img class="event-hero-bg" id="eventHeroBg" src="" alt="">
    <div class="event-hero-gradient"></div>
    <div class="event-hero-content">
      <div class="eyebrow" style="color:rgba(255,255,255,0.6);margin-bottom:10px;">Event Details</div>
      <h1 id="eventTitle"><span id="eventTitleSk" class="event-detail-sk-title bento-skeleton"></span><span id="eventTitleText" hidden></span></h1>
      <div class="event-hero-meta">
        <div class="event-meta-pill"><i class="fa-solid fa-calendar"></i> <span id="eventDate">—</span></div>
        <div class="event-meta-pill"><i class="fa-solid fa-users"></i> <span id="eventParticipants">—</span> Participants</div>
        <div class="event-meta-pill"><i class="fa-solid fa-trophy"></i> <span id="eventTeams">—</span> Teams</div>
      </div>
    </div>
  </div>
  <div class="event-detail-body">
    <div class="container">
      <div class="event-detail-grid">
        <div class="event-description-block">
          <h2>About This Event</h2>
          <div id="eventDescSk" class="event-detail-sk-desc">
            <div class="event-detail-sk-line bento-skeleton"></div>
            <div class="event-detail-sk-line bento-skeleton" style="width:88%"></div>
            <div class="event-detail-sk-line bento-skeleton" style="width:75%"></div>
            <div class="event-detail-sk-line bento-skeleton" style="width:92%"></div>
            <div class="event-detail-sk-line bento-skeleton" style="width:60%"></div>
          </div>
          <p id="eventDescription" style="color:var(--muted);line-height:1.8;" hidden></p>
          <div id="eventTimelineSlot" style="margin-top:2rem;"></div>
          <div id="eventCarouselSlot" style="margin-top:2rem;"></div>
        </div>
        <div class="event-sidebar">
          <div class="event-stat-cards">
            <div class="event-stat-card"><div class="num" id="sidebarParticipants">—</div><div class="lbl">Participants</div></div>
            <div class="event-stat-card"><div class="num" id="sidebarTeams">—</div><div class="lbl">Teams</div></div>
          </div>
          <button class="btn-primary" style="width:100%;justify-content:center;" onclick="navigateTo('certificates')">
            <i class="fa-solid fa-certificate"></i> Get Certificate
          </button>
        </div>
      </div>
      <div id="gallerySection" style="margin-top:3rem;display:none;">
        <h3 style="font-family:var(--font-display);font-size:1.4rem;font-weight:700;margin-bottom:1rem;">Event Gallery</h3>
        <div class="gallery-grid" id="eventGalleryGrid"></div>
      </div>
    </div>
  </div>
</div>
