<style>
.sk { border-radius: 10px; overflow: hidden; position: relative; background: rgba(255,255,255,0.04); }
.sk::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.06) 50%, transparent 100%);
  background-size: 200% 100%;
  animation: skShimmer 1.6s infinite;
}
@keyframes skShimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
.sk-light { background: rgba(10,36,99,0.06) !important; }
.sk-light::after {
  background: linear-gradient(90deg, transparent 0%, rgba(10,36,99,0.10) 50%, transparent 100%) !important;
}

/* Page loading overlay */
#initial-loader {
  position: fixed; inset: 0; background: #fff; z-index: 99999;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 0;
  transition: opacity 0.4s ease;
}
#initial-loader .loader-ring {
  position: relative;
  width: 80px; height: 80px;
  display: flex; align-items: center; justify-content: center;
}
#initial-loader .loader-ring svg {
  position: absolute; inset: 0;
  width: 80px; height: 80px;
  animation: spin 1s linear infinite;
}
#initial-loader .loader-logo-img {
  width: 52px; height: 52px;
  border-radius: 50%;
  object-fit: cover;
  position: relative; z-index: 1;
  background: linear-gradient(135deg, #0A2463, #2979FF);
  display: flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 0.9rem; color: white;
  font-family: 'Plus Jakarta Sans', sans-serif;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
