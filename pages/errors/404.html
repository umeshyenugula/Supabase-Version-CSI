<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Page Not Found | CSI GRIET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
  :root { --blue:#0A2463; --accent:#2979FF; --ink:#0D0D0D; }
  *, *::before, *::after { box-sizing: border-box; margin:0; padding:0; }
  body { font-family:'Plus Jakarta Sans',sans-serif; background:#f8fbff; color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .scene { text-align:center; padding:2rem; position:relative; z-index:2; }
  .code { font-size:clamp(6rem,20vw,14rem); font-weight:800; line-height:1; letter-spacing:-0.05em; background:linear-gradient(135deg,var(--blue),var(--accent),#00e5ff); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
  .title { font-size:clamp(1.4rem,3vw,2.2rem); font-weight:700; margin:1rem 0 0.5rem; color:var(--ink); }
  .sub { font-size:1rem; color:#666; max-width:420px; margin:0 auto 2rem; line-height:1.6; }
  .actions { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; }
  .btn { display:inline-flex; align-items:center; gap:8px; padding:13px 26px; border-radius:100px; font-family:inherit; font-size:0.9rem; font-weight:600; text-decoration:none; transition:all 0.3s ease; cursor:pointer; border:none; }
  .btn-primary { background:var(--ink); color:#fff; }
  .btn-primary:hover { background:var(--blue); transform:translateY(-2px); }
  .btn-ghost { background:transparent; color:var(--ink); border:2px solid rgba(0,0,0,0.14); }
  .btn-ghost:hover { border-color:var(--accent); color:var(--accent); }
  .orb { position:fixed; border-radius:50%; pointer-events:none; filter:blur(80px); animation:drift 14s ease-in-out infinite; }
  .orb-1 { width:500px; height:500px; background:radial-gradient(circle,rgba(41,121,255,0.07),transparent 70%); top:-150px; left:-150px; }
  .orb-2 { width:400px; height:400px; background:radial-gradient(circle,rgba(10,36,99,0.05),transparent 70%); bottom:-100px; right:-100px; animation-delay:-7s; }
  @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-20px)} }
  .grid-bg { position:fixed; inset:0; background-image:linear-gradient(rgba(41,121,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(41,121,255,0.03) 1px,transparent 1px); background-size:48px 48px; pointer-events:none; }
  .icon-wrap { font-size:3rem; margin-bottom:1rem; opacity:0.15; }
  .breadcrumb { font-size:0.75rem; color:#999; margin-bottom:1.5rem; letter-spacing:0.08em; text-transform:uppercase; }
  .breadcrumb a { color:var(--accent); text-decoration:none; }
  .help-row { margin-top:1.75rem; font-size:0.85rem; color:#888; }
  .help-row a { color:var(--accent); text-decoration:none; font-weight:600; }
  .help-row a:hover { text-decoration:underline; }
</style>
</head>
<body>
<div class="grid-bg"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>
<div class="scene">
  <div class="breadcrumb"><a href="https://csi.griet.ac.in/">CSI GRIET</a> &rarr; 404</div>
  <div class="icon-wrap"><i class="fa-solid fa-satellite-dish"></i></div>
  <div class="code">404</div>
  <div class="title">Signal Lost</div>
  <p class="sub">We searched every corner of our server galaxy but couldn't locate the page you're looking for. It may have been moved or never existed.</p>
  <div class="actions">
    <a href="https://csi.griet.ac.in/" class="btn btn-primary"><i class="fa-solid fa-house"></i> Back to Home</a>
    <a href="https://csi.griet.ac.in/events" class="btn btn-ghost"><i class="fa-solid fa-calendar"></i> View Events</a>
  </div>
  <p class="help-row">
    <i class="fa-solid fa-circle-question"></i>
    Need help? <a href="https://csi.griet.ac.in/help">Visit our Help &amp; Docs page</a> or
    <a href="mailto:csigriet2023@gmail.com">contact us directly</a>.
  </p>
</div>
</body>
</html>
